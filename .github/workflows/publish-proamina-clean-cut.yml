name: Repair glitchy Proamina hero loop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-proamina-clean-cut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hero-video:
    runs-on: ubuntu-latest
    env:
      SOURCE_VIDEO: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/21090fce-d339-459f-ab45-092b9e02edaa.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTQ5MTFiMWEzZDE4OTE4YyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzk0NjkwNn0.8YWqNGclF2uxsVy98-JiI4PAuRh-oYGZ5nEVvio6Hig'
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone FFmpeg without system packages
        run: |
          python3 -m pip install --disable-pip-version-check imageio-ffmpeg
          echo "FFMPEG_BIN=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Download the original video
        run: |
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_VIDEO" -o /tmp/proamina-original.mp4
      - name: Export clean cut without crossfade or ghost frames
        run: |
          set -euo pipefail
          mkdir -p assets/video
          "$FFMPEG_BIN" -nostdin -y -hide_banner -loglevel error \
            -ss 0.208333 -i /tmp/proamina-original.mp4 -t 9.75 \
            -map 0:v:0 -an -vf 'fps=24,format=yuv420p' \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart \
            assets/video/proamina-hero-clean-v2.mp4
          python3 - <<'PY'
          import imageio_ffmpeg, pathlib
          path = pathlib.Path('assets/video/proamina-hero-clean-v2.mp4')
          reader = imageio_ffmpeg.read_frames(str(path))
          metadata = next(reader)
          reader.close()
          assert metadata['source_size'] == (1440, 608), metadata
          assert 9.7 < metadata['duration'] < 9.8, metadata
          assert path.stat().st_size < 10000000, path.stat().st_size
          print('Clean silent 1440x608 video:', metadata, path.stat().st_size, 'bytes')
          PY
      - name: Commit repaired video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/proamina-hero-clean-v2.mp4
          if ! git diff --staged --quiet; then
            git commit -m "media: publish real hard-cut hero video without glitch"
            git push
          fi
