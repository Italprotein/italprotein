name: Publish seamless Proamina hero v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-proamina-loop-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone FFmpeg
        run: python3 -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Shift the clip to a natural seamless seam
        run: |
          set -euo pipefail
          mkdir -p assets/video
          FFMPEG_BIN=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FFMPEG_BIN" -nostdin -y -hide_banner -loglevel error -i assets/video/proamina-hero-clean-v2.mp4 \
            -filter_complex '[0:v]split=2[tail][head];[tail]trim=start_frame=218:end_frame=234,setpts=PTS-STARTPTS[A];[head]trim=start_frame=1:end_frame=218,setpts=PTS-STARTPTS[B];[A][B]concat=n=2:v=1:a=0,format=yuv420p[v]' \
            -map '[v]' -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p -movflags +faststart \
            assets/video/proamina-hero-seamless-v3.mp4
          python3 - <<'PY'
          import imageio_ffmpeg, pathlib
          path = pathlib.Path('assets/video/proamina-hero-seamless-v3.mp4')
          reader = imageio_ffmpeg.read_frames(str(path))
          metadata = next(reader)
          reader.close()
          assert metadata['source_size']==(1440,608), metadata
          assert 9.60 < metadata['duration'] < 9.75, metadata
          assert path.stat().st_size < 10000000, path.stat().st_size
          print('New video with no ghost frames:',metadata,path.stat().st_size)
          PY
      - name: Commit new seamless hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/proamina-hero-seamless-v3.mp4
          if ! git diff --staged --quiet; then
            git commit -m "media: seamless Proamina hero v3 using matching boundary frames"
            git push
          fi
