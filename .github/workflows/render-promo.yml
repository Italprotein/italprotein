name: Render Proamina promo videos
on:
  push:
    branches: [main]
    paths:
      - scripts/render_promo_video.py
      - .github/workflows/render-promo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free renderer
        run: |
          python -m pip install --disable-pip-version-check pillow
          ffmpeg -version | head -n 1
      - name: Create silent MP4 promo in Italian and English
        run: python scripts/render_promo_video.py
      - name: Commit generated site media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/proamina-promo-it.mp4 assets/video/proamina-promo-en.mp4
          if git diff --staged --quiet; then
            echo "Promo video unchanged"
          else
            git commit -m "media: render Proamina promo videos for storefront"
            git push
          fi
