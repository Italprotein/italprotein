name: Unblock stuck GitHub Pages deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stalled-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the specific orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'Old deployment status:'
          gh api repos/Italprotein/italprotein/pages/deployments/14a9aa4cc60ef31144c54a99775b0ed3f1beed09 || true
          gh api -X POST repos/Italprotein/italprotein/pages/deployments/14a9aa4cc60ef31144c54a99775b0ed3f1beed09/cancel
          echo 'Status after cancellation:'
          gh api repos/Italprotein/italprotein/pages/deployments/14a9aa4cc60ef31144c54a99775b0ed3f1beed09 || true
