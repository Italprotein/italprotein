name: Publish supplied Proamina hero video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-proamina-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-video:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0bbfc642-dc72-485f-9774-9f8e59e8a7a5.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODRmYjhmMmU0NGZiNThhOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzk4MTEwMn0.LLdy34XjDvX0UfTNwoo8reSK6Uu-S0X_s2s6JdAT5yw'
    steps:
      - uses: actions/checkout@v4
      - name: Install video converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Convert to silent web hero MP4 and poster
        run: |
          mkdir -p assets/video assets/img
          curl --fail --location --retry 3 --silent --show-error -o /tmp/proamina-source.mp4 "$SOURCE_URL"
          ffmpeg -nostdin -y -hide_banner -loglevel error -i /tmp/proamina-source.mp4 -an -vf 'scale=1280:-2' -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart assets/video/proamina-hero.mp4
          ffmpeg -nostdin -y -hide_banner -loglevel error -ss 0.2 -i /tmp/proamina-source.mp4 -frames:v 1 -vf 'scale=1280:-2' -q:v 3 assets/img/proamina-hero-video-poster.jpg
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 assets/video/proamina-hero.mp4
          ls -lh assets/video/proamina-hero.mp4 assets/img/proamina-hero-video-poster.jpg
      - name: Publish the video and the poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/proamina-hero.mp4 assets/img/proamina-hero-video-poster.jpg
          if git diff --staged --quiet; then
            echo "Hero video already up-to-date"
          else
            git commit -m "media: publish user-supplied silent Proamina hero video"
            git push
          fi
